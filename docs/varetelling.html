</div>

<div class="screen" id="scannerScreen">

    <div class="header">

    </div>
    <div class="scanner-layout">

        <div class="content-area">

            </div>

            <!-- Current product -->

        <div id="saveProgressWrap" style="display:none; position:fixed; bottom:80px; left:0; right:0; z-index:101; padding:6px 20px; background:#1e1e2e; border-top:1px solid #333;">
            <div id="saveProgressLabel" style="font-size:13px; color:#aaa; margin-bottom:4px; text-align:center;"></div>
            <div style="width:100%; height:8px; background:#333; border-radius:99px; overflow:hidden;">
                <div id="saveProgressBar" style="height:100%; width:0%; background:#00b894; border-radius:99px;"></div>
            </div>
        </div>

        <div class="bottom-bar">
            <button class="btn btn-success" id="saveBtn" onclick="saveAll()">

                    ⋮

                </button>

                        <span style="display:block; font-size:11px; color:var(--text-muted); margin-top:2px; font-weight:normal;">Tell antall på lager</span>
                    </button>
                    <button onclick="switchMode('restock'); closeMoreMenu()">📦 Varepåfyll
                        <span style="display:block; font-size:11px; color:var(--text-muted); margin-top:2px; font-weight:normal;">Legg til antall på eksisterende lager</span>
                    </button>
                    <button onclick="refreshProductCache()">🔄 Oppdater produktliste
                        <span style="display:block; font-size:11px; color:var(--text-muted); margin-top:2px; font-weight:normal;">Tving ny nedlasting fra MyStore</span>
                    </button>
                    <button id="appRefreshBtn" onclick="hardReloadApp(); closeMoreMenu()">🔄 Oppdater appen
                        <span id="appRefreshHint" style="display:block; font-size:11px; color:var(--text-muted); margin-top:2px; font-weight:normal;">Tøm cache og hent siste versjon. Beholder API-nøkkel og innstillinger</span>
                    </button>
                    <button onclick="showDebugLog(); closeMoreMenu()">🐛 Feilsøkingslogg</button>
                    <button onclick="logoutAndReset(); closeMoreMenu()">
                        🔒 Nullstill innstillinger

 </div>

<script src="crypto.js"></script>
<script>
// ─── KONSTANTER ──────────────────────────────────────
const STORAGE_KEY          = 'ms_enc_v1';
const PRODUCT_CACHE_KEY    = 'ms_product_cache';
const COUNTED_ITEMS_KEY    = 'ms_counted_items';
const RESTOCK_ITEMS_KEY    = 'ms_restock_items';
const SESSION_KEY          = 'ms_session';
const SESSION_TIMEOUT      = 2 * 60 * 60 * 1000; // 2 timer
const PRODUCT_CACHE_VERSION = 5;
const PRODUCT_CACHE_MAX_AGE = 4 * 60 * 60 * 1000; // 4 timer
const APP_LOADED_AT = Date.now();
const UPDATE_CHECK_PATHS = ['./varetelling.html', './styles.css', './crypto.js', './sw.js'];

// ─── STATE ───────────────────────────────────────────
let config = { shopName: '', apiKey: '' };
let productCache = {};      // EAN → { id, variantId, name, ean, sku, quantity, productId }
let countedItems = [];       // { variantId, productId, name, ean, sku, oldQty, newQty, status }
try { countedItems = JSON.parse(localStorage.getItem(COUNTED_ITEMS_KEY) || '[]'); } catch(e) { countedItems = []; }
let restockItems = [];       // { variantId, productId, name, variantName, ean, oldQty, addQty, status }
try { restockItems = JSON.parse(localStorage.getItem(RESTOCK_ITEMS_KEY) || '[]'); } catch(e) { restockItems = []; }
let appMode = 'count';       // 'count' | 'restock'
let html5QrCode = null;
let isScanning = false;
let lastScannedCode = '';
let lastScanTime = 0;
let debugLog = [];  // For å lagre siste loggmeldinger
let updateAvailable = false;
let updateToastShown = false;

function addDebugLog(message) {
    debugLog.push(new Date().toLocaleTimeString() + ': ' + message);
    if (debugLog.length > 10) debugLog.shift();  // Behold kun siste 10
}

function saveCountedItems() {
    try { localStorage.setItem(COUNTED_ITEMS_KEY, JSON.stringify(countedItems)); } catch(e) {}
}

function saveRestockItems() {
    try { localStorage.setItem(RESTOCK_ITEMS_KEY, JSON.stringify(restockItems)); } catch(e) {}
}

function saveSession() {
    const data = { shopName: config.shopName, apiKey: config.apiKey, lastActivity: Date.now() };
    try { localStorage.setItem(SESSION_KEY, JSON.stringify(data)); } catch(e) {}
    console.log('saveSession: lagret sesjon', data.shopName, 'key:', SESSION_KEY);
}
function touchSession() {
    try {
        const raw = localStorage.getItem(SESSION_KEY);
        if (raw) {
            const s = JSON.parse(raw);
            s.lastActivity = Date.now();
            localStorage.setItem(SESSION_KEY, JSON.stringify(s));
        }
    } catch(e) {}
}
function loadSession() {
    try {
        const raw = localStorage.getItem(SESSION_KEY);
        console.log('loadSession: raw=', raw ? raw.substring(0,60) : 'null');
        if (!raw) return null;
        const s = JSON.parse(raw);
        const age = Date.now() - s.lastActivity;
        console.log('loadSession: alder=', Math.round(age/1000) + 's', 'timeout=', SESSION_TIMEOUT/1000 + 's');
        if (age > SESSION_TIMEOUT) { localStorage.removeItem(SESSION_KEY); return null; }
        return s;
    } catch(e) { console.log('loadSession feil:', e); return null; }
}
function clearSession() {
    localStorage.removeItem(SESSION_KEY);
}

async function setProgress(pct, label) {
    const bar  = document.getElementById('loadProgressBar');
    const lbl  = document.getElementById('loadProgressLabel');
    const wrap = document.getElementById('loadProgress');
    console.log('setProgress', pct, label, 'bar:', bar, 'wrap:', wrap);
    if (!bar) { console.error('loadProgressBar not found!'); return; }
    if (pct === null) { wrap.style.display = 'none'; bar.style.width = '0%'; return; }
    wrap.style.display = 'block';
    bar.style.width = pct + '%';
    if (label) lbl.textContent = label;
    await new Promise(r => setTimeout(r, 60));
}

function toggleMoreMenu(e) {
    e.stopPropagation();
    document.getElementById('moreDropdown').classList.toggle('open');
}
function closeMoreMenu() {
    document.getElementById('moreDropdown')?.classList.remove('open');
}
document.addEventListener('click', () => closeMoreMenu());

function setUpdateAvailableState(isAvailable) {
    updateAvailable = isAvailable;
    const btn = document.getElementById('appRefreshBtn');
    const hint = document.getElementById('appRefreshHint');
    const moreTrigger = document.getElementById('moreTrigger');
    const moreTriggerBadge = document.getElementById('moreTriggerBadge');
    if (!btn || !hint) return;

    if (isAvailable) {
        btn.childNodes[0].textContent = '🔄 Oppdater appen';
        hint.textContent = 'Ny versjon tilgjengelig. Tøm cache og hent siste versjon. Beholder API-nøkkel og innstillinger';
        moreTrigger?.classList.add('has-update');
        moreTriggerBadge?.classList.add('visible');
        if (!updateToastShown) {
            updateToastShown = true;
            showToast('Ny versjon av appen er tilgjengelig. Åpne menyen og velg «Oppdater appen».', 'success');
        }
    } else {
        btn.childNodes[0].textContent = '🔄 Oppdater appen';
        hint.textContent = 'Tøm cache og hent siste versjon. Beholder API-nøkkel og innstillinger';
        moreTrigger?.classList.remove('has-update');
        moreTriggerBadge?.classList.remove('visible');
    }
}

async function checkForAppUpdate() {
    if (updateAvailable) return true;

    for (const path of UPDATE_CHECK_PATHS) {
        try {
            const sep = path.includes('?') ? '&' : '?';
            const response = await fetch(`${path}${sep}update_check=${Date.now()}`, {
                method: 'HEAD',
                cache: 'no-store'
            });
            if (!response.ok) continue;

            const lastModified = response.headers.get('Last-Modified');
            if (!lastModified) continue;

            const modifiedAt = Date.parse(lastModified);
            if (!Number.isNaN(modifiedAt) && modifiedAt > (APP_LOADED_AT + 1000)) {
                setUpdateAvailableState(true);
                addDebugLog(`Oppdatering oppdaget i ${path}`);
                return true;
            }
        } catch (e) {
            addDebugLog(`Oppdateringssjekk feilet for ${path}: ${e.message}`);
        }
    }

    return false;
}

function switchMode(mode) {
    appMode = mode;
    const isRestock = mode === 'restock';
    document.body.classList.toggle('restock-mode', isRestock);
    const title = document.getElementById('screenTitle');
    if (title) title.innerHTML = isRestock
        ? 'Varepåfyll <span>Garnhexene</span>'
        : 'Varetelling <span>Garnhexene</span>';
    // Skjul feil seksjon
    document.getElementById('countedSection').style.display  = isRestock ? 'none' : '';
    document.getElementById('restockSection').style.display  = isRestock ? '' : 'none';
    // Lukk eventuelle åpne produktkort
    document.getElementById('currentProduct').innerHTML = '';
    restoreScannerArea();
    showToast(isRestock ? '📦 Varepåfyll-modus aktivert' : '🔢 Varetelling-modus aktivert', 'success');
}

// ─── SETUP ───────────────────────────────────────────
function renderSetupScreen() {
    const stored = localStorage.getItem(STORAGE_KEY);
    const container = document.getElementById('setupContainer');

    if (stored) {
        container.innerHTML = `
            <h2>Velkommen tilbake</h2>
            <p>Tast inn PIN-koden din for å starte varetelling.</p>
            <div class="field">
                <label>PIN-kode</label>
                <input type="password" id="pinInput" placeholder="••••" inputmode="numeric"
                    style="font-size:28px; letter-spacing:8px; text-align:center;"
                    onkeydown="if(event.key==='Enter') unlockWithPin()">
            </div>
            <button class="btn btn-primary" id="connectBtn" onclick="unlockWithPin()">
                Lås opp
            </button>
            <button class="btn btn-secondary" onclick="logoutAndReset()"
                style="margin-top:12px; background:transparent; color:var(--text-muted); border:none; font-size:13px;">
                Bruk andre innstillinger &rarr;
            </button>
            <button onclick="showDebugLog()"
                style="margin-top:24px; display:block; width:100%; background:none; border:none; border-top:1px solid var(--border); color:var(--text); font-size:15px; text-align:left; padding:14px 18px; cursor:pointer; border-radius:0 0 var(--radius) var(--radius);">
                🐛 Feilsøkingslogg
            </button>
        `;
        setTimeout(() => document.getElementById('pinInput')?.focus(), 100);
    } else {
        container.innerHTML = `
            <h2>Kom i gang</h2>
            <p>Innstillingene lagres kryptert på denne enheten – bare du med PIN-koden kan bruke dem.</p>
            <div class="field">
                <label>Butikknavn</label>
                <input type="text" id="shopName" placeholder="garnhexene8015">
                <div class="hint">F.eks. «garnhexene8015» fra garnhexene8015.mystore4.no</div>
            </div>
            <div class="field">
                <label>API-nøkkel</label>
                <input type="password" id="apiKey" placeholder="Din MyStore API-nøkkel">
                <div class="hint">Finnes i MyStore kontrollpanel → API</div>
            </div>
            <div class="field">
                <label>Velg PIN-kode</label>
                <input type="password" id="pinNew" placeholder="Velg PIN" inputmode="numeric"
                    style="font-size:22px; letter-spacing:6px; text-align:center;">
                <div class="hint">Minst 4 tegn. Brukes til å kryptere API-nøkkelen på enheten.</div>
            </div>
            <div class="field">
                <label>Bekreft PIN-kode</label>
                <input type="password" id="pinConfirm" placeholder="Gjenta PIN" inputmode="numeric"
                    style="font-size:22px; letter-spacing:6px; text-align:center;"
                    onkeydown="if(event.key==='Enter') setupAndConnect()">
            </div>
            <button class="btn btn-primary" id="connectBtn" onclick="setupAndConnect()">
                Lagre og koble til
            </button>
        `;
    }
}

async function setupAndConnect() {
    const shopName   = document.getElementById('shopName').value.trim();
    const apiKey     = document.getElementById('apiKey').value.trim();
    const pin        = document.getElementById('pinNew').value;
    const pinConfirm = document.getElementById('pinConfirm').value;

    if (!shopName || !apiKey) { showToast('Fyll inn butikknavn og API-nøkkel', 'error'); return; }
    if (pin.length < 4)       { showToast('PIN må være minst 4 tegn', 'error'); return; }
    if (pin !== pinConfirm)   { showToast('PIN-kodene stemmer ikke overens', 'error'); return; }

    const btn = document.getElementById('connectBtn');
    btn.innerHTML = '<span class="spinner"></span> Lagrer og kobler til...';
    btn.disabled = true;

    config.shopName = shopName.replace(/^https?:\/\//, '').replace(/\.mystore.*$/, '').replace(/\/$/, '');
    config.apiKey   = apiKey;

    try {
        const data = await apiFetch('/products?page[size]=1&page[number]=1');
        if (!data.data) throw new Error('Feil respons fra API');

        const encrypted = await encryptCredentials(config.shopName, config.apiKey, pin);
        localStorage.setItem(STORAGE_KEY, encrypted);
        addDebugLog('Innstillinger kryptert og lagret');

        showToast('Tilkoblet! Laster produkter...', 'success');
        await cacheAllVariants();
        saveSession();
        goToScanner();
    } catch (err) {
        addDebugLog('Tilkobling feilet: ' + err.message);
        showToast('Kunne ikke koble til: ' + err.message, 'error');
        btn.innerHTML = 'Lagre og koble til';
        btn.disabled = false;
    }
}

async function unlockWithPin() {
    const pin    = document.getElementById('pinInput').value;
    const stored = localStorage.getItem(STORAGE_KEY);
    if (!pin || !stored) return;

    const btn = document.getElementById('connectBtn');
    btn.innerHTML = '<span class="spinner"></span> Kobler til...';
    btn.disabled = true;

    try {
        await setProgress(10, 'Dekrypterer...');
        const creds = await decryptCredentials(stored, pin);
        config.shopName = creds.shopName;
        config.apiKey   = creds.apiKey;

        showToast('Tilkoblet! Laster produkter...', 'success');
        await cacheAllVariants(setProgress);
        setProgress(null);
        saveSession();
        goToScanner();
    } catch (err) {
        const isCryptoErr = err.name === 'OperationError';
        const msg = isCryptoErr ? 'Feil PIN-kode' : ('Feil: ' + err.message);
        showToast(msg, 'error');
        addDebugLog('Innloggingsfeil: ' + err.message);
        btn.innerHTML = 'Lås opp';
        btn.disabled = false;
        if (isCryptoErr) document.getElementById('pinInput').value = '';
    }
}

function goToScanner() {
    document.getElementById('setupScreen').classList.remove('active');
    document.getElementById('scannerScreen').classList.add('active');
    startScanner();
    updateCountedList();
    updateRestockList();
    // Start alltid i varetelling-modus
    document.getElementById('restockSection').style.display = 'none';
    updateBadge();
}

function logoutAndReset() {
    showConfirm(
        'Slett lagrede innstillinger?',
        'API-nøkkelen fjernes fra denne enheten. Du må taste den inn på nytt.',
        () => {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem(PRODUCT_CACHE_KEY);
            localStorage.removeItem(COUNTED_ITEMS_KEY);
            localStorage.removeItem(RESTOCK_ITEMS_KEY);
            clearSession();
            config = { shopName: '', apiKey: '' };
            productCache = {};
            countedItems = [];
            restockItems = [];
            if (isScanning && html5QrCode) {
                html5QrCode.stop().catch(() => {});
                isScanning = false;
            }
            document.getElementById('scannerScreen').classList.remove('active');
            document.getElementById('setupScreen').classList.add('active');
            renderSetupScreen();
        }
    );
}

// ─── API HELPERS ─────────────────────────────────────
function apiBase() {
    return `https://api.mystore.no/shops/${config.shopName}`;
}

async function apiFetch(path, options = {}, _retry = 0) {
    const url = apiBase() + path;
    const headers = {
        'Authorization': `Bearer ${config.apiKey}`,
        'Accept': 'application/vnd.api+json',
        ...(options.headers || {})
    };

    const controller = new AbortController();
    const timeout = setTimeout(() => controller.abort(), 15000); // 15s timeout
    let r;
    try {
        r = await fetch(url, { ...options, headers, signal: controller.signal });
    } catch (err) {
        clearTimeout(timeout);
        if (err.name === 'AbortError') throw new Error('Tidsavbrudd – ingen svar fra API etter 15s');
        throw err;
    }
    clearTimeout(timeout);
    const text = await r.text();

    let data = null;
    try { data = text ? JSON.parse(text) : null; } catch { data = text; }

    if (r.status === 429 && _retry < 4) {
        const retryAfter = parseInt(r.headers.get('Retry-After') || '0') * 1000;
        const wait = retryAfter || (2 ** (_retry + 1)) * 1000; // 2s, 4s, 8s, 16s
        addDebugLog(`429 rate limit – venter ${wait / 1000}s (forsøk ${_retry + 1})`);
        await new Promise(res => setTimeout(res, wait));
        return apiFetch(path, options, _retry + 1);
    }

    if (!r.ok) {
        console.error('API error', { url, status: r.status, response: data });
        throw new Error(`HTTP ${r.status}: ${typeof data === 'string' ? data : JSON.stringify(data)}`);
    }

    return data;
}

// Hjelpefunksjon: hent alle sider for et endepunkt sekvensielt
async function fetchAllPages(path, maxPages = 50, onPageProgress = null) {
    const sep = path.includes('?') ? '&' : '?';
    const firstData = await apiFetch(`${path}${sep}page[number]=1`);
    const allItems = [...(firstData.data || [])];

    // Finn siste sidenummer fra links.last
    let lastPage = 1;
    if (firstData.links?.last) {
        const m = firstData.links.last.match(/page\[number\]=(\d+)/);
        if (m) lastPage = Math.min(parseInt(m[1]), maxPages);
    }

    for (let p = 2; p <= lastPage; p++) {
        const d = await apiFetch(`${path}${sep}page[number]=${p}`);
        allItems.push(...(d.data || []));
        if (onPageProgress) onPageProgress(p, lastPage);
    }

    return allItems;
}

// Som fetchAllPages, men returnerer hele side-objekter (inkl. "included")
async function fetchAllPagesRaw(path, maxPages = 50, onPageProgress = null) {
    const sep = path.includes('?') ? '&' : '?';
    const firstPage = await apiFetch(`${path}${sep}page[number]=1`);
    const allPages = [firstPage];

    let lastPage = 1;
    if (firstPage.links?.last) {
        const m = firstPage.links.last.match(/page\[number\]=(\d+)/);
        if (m) lastPage = Math.min(parseInt(m[1]), maxPages);
    }

    for (let p = 2; p <= lastPage; p++) {
        const page = await apiFetch(`${path}${sep}page[number]=${p}`);
        allPages.push(page);
        if (onPageProgress) await onPageProgress(p, lastPage);
    }

    return allPages;
}


async function cacheAllVariants(onProgress = null, forceRefresh = false) {
    const prog = async (pct, lbl) => {
        if (onProgress) await onProgress(pct, lbl);
    };

    // Bruk localStorage-cache hvis fersk nok
    if (!forceRefresh) {
        try {
            const saved = localStorage.getItem(PRODUCT_CACHE_KEY);
            if (saved) {
                const { ts, data, v } = JSON.parse(saved);
                if (v === PRODUCT_CACHE_VERSION && Date.now() - ts < PRODUCT_CACHE_MAX_AGE) {
                    productCache = data;
                    const count = Object.keys(data).length;
                    await prog(100, 'Ferdig!');
                    console.log(`Produktcache lastet fra localStorage (${Math.round((Date.now()-ts)/60000)} min siden, ${count} oppføringer)`);
                    addDebugLog(`Brukte localStorage-cache: ${count} oppføringer`);
                    return;
                }
            }
        } catch(e) { addDebugLog('Cache-les feil: ' + e.message); }
    }

    updateScannerStatus('Laster data parallelt...');
    await prog(20, 'Laster produkter og attributter...');

    // Last produkter
    await prog(25, 'Laster produkter...');
    const products = await fetchAllPages('/products?page[size]=250&fields[products]=name,sku,ean');

    addDebugLog(`Lastet: ${products.length} produkter`);

    // Bygg produktnavn-kart
    const productNames = {};
    const allProductEANs = [];
    for (const p of products) {
        const name = decodeHtmlEntities(p.attributes.name?.no || p.attributes.name?.en || '');
        productNames[p.id] = name;
        if (p.attributes.ean) {
            productCache[p.attributes.ean] = {
                productId: p.id, variantId: null, name, variantName: '',
                ean: p.attributes.ean, sku: '', quantity: 0
            };
            allProductEANs.push(p.attributes.ean);
        }
    }

    // Last alle opsjonsverdier (liten tabell – typisk 10‑100 oppføringer)
    await prog(40, 'Laster opsjonsverdier...');
    const optionValues = await fetchAllPages('/product-option-values?page[size]=250');
    const optionValueNames = {};
    for (const ov of optionValues) {
        const n = ov.attributes?.name;
        const raw = (n && typeof n === 'object')
            ? (n.no || n.en || Object.values(n)[0] || '') : (n || '');
        optionValueNames[ov.id] = decodeHtmlEntities(raw);
    }
    addDebugLog(`${optionValues.length} opsjonsverdier lastet`);

    // Last varianter med product-attributes som include (henter kun attributter
    // for akkurat de variantene på hver side – ingen separat paginering)
    updateScannerStatus('Laster varianter...');
    await prog(50, 'Laster varianter (side 1)...');

    const variantPages = await fetchAllPagesRaw(
        '/product-variants?page[size]=250&include=product-attributes',
        100,
        async (page, total) => {
            const pct = 50 + Math.round((page / total) * 38);
            await prog(pct, `Laster varianter (side ${page}/${total})...`);
        }
    );
    addDebugLog(`Hentet ${variantPages.length} variant-sider med page[size]=250`);

    // Bygg pa → opsjonverdi-id kart fra included-data
    const paToOptionValueId = {};
    for (const page of variantPages) {
        for (const inc of (page.included || [])) {
            if (inc.type === 'product-attributes') {
                const ovId = inc.relationships?.['product-option-value']?.data?.id;
                if (ovId) paToOptionValueId[inc.id] = ovId;
            }
        }
    }

    const variants = variantPages.flatMap(p => p.data || []);
    addDebugLog(`Lastet ${variants.length} varianter, ${Object.keys(paToOptionValueId).length} produktattributter via include`);

    let variantCount = 0;
    let firstNamedLogged = false;
    for (const v of variants) {
        const attr = v.attributes;
        const productId = v.relationships?.product?.data?.id;
        const name = decodeHtmlEntities(productNames[productId] || 'Ukjent produkt');

        const paIds = (v.relationships?.['product-attributes']?.data || []).map(d => d.id);
        const vNameParts = paIds
            .map(paId => { const ovId = paToOptionValueId[paId]; return ovId ? (optionValueNames[ovId] || '') : ''; })
            .filter(Boolean);
        const vName = vNameParts.join(' / ');
        if (!firstNamedLogged && vName) {
            addDebugLog(`Første variant med navn: id=${v.id}, vName="${vName}"`);
            firstNamedLogged = true;
        }
        // Debug: logg varianter med paIds men uten navn
        if (paIds.length > 0 && !vName && variantCount < 5) {
            const ovIds = paIds.map(id => paToOptionValueId[id] || 'mangler');
            addDebugLog(`Variant ${v.id} har ${paIds.length} paId(s), ovIds=[${ovIds.join(',')}], ean=${attr.ean||'-'}`);
        }

        const entry = {
            productId, variantId: v.id, name, variantName: vName,
            ean: attr.ean || '', sku: attr.sku || '',
            quantity: parseInt(attr.quantity) || 0
        };
        if (attr.ean) productCache[attr.ean] = entry;
        productCache['vid:' + v.id] = entry;
        variantCount++;
    }

    // Lagre cache til localStorage
    try {
        localStorage.setItem(PRODUCT_CACHE_KEY, JSON.stringify({ v: PRODUCT_CACHE_VERSION, ts: Date.now(), data: productCache }));
        addDebugLog('Produktcache lagret til localStorage');
    } catch(e) { addDebugLog('Cache-lagring feil: ' + e.message); }

    await prog(100, 'Ferdig!');
    showToast(`${products.length} produkter, ${variantCount} varianter lastet`, 'success');
    addDebugLog(`Ferdig: ${products.length} produkter, ${variantCount} varianter`);
}

// ─── SCANNER ─────────────────────────────────────────
function startScanner() {
    html5QrCode = new Html5Qrcode("reader");

    const scanConfig = {
        fps: 8,
        aspectRatio: 1.5,
        formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128,
            Html5QrcodeSupportedFormats.CODE_39,
            Html5QrcodeSupportedFormats.CODE_93,
            Html5QrcodeSupportedFormats.CODABAR,
        ]
    };

    html5QrCode.start(
        { facingMode: "environment" },
        scanConfig,
        onScanSuccess,
        (errorMessage) => {
            // Logg feil for debugging
            console.log('Skanningsfeil:', errorMessage);
        }
    ).then(() => {
        isScanning = true;
        updateScannerStatus('Skann en strekkode...');
        // Fjern den lilla shaded-region som biblioteket injiserer i DOM
        const readerEl = document.getElementById('reader');
        const removeShadedRegion = () => {
            const el = document.getElementById('qr-shaded-region');
            if (el) el.remove();
        };
        removeShadedRegion();
        const obs = new MutationObserver(removeShadedRegion);
        obs.observe(readerEl, { childList: true, subtree: true });

        // Trykk-for-fokus
        const scannerArea = document.getElementById('scannerArea');
        const focusRing = document.getElementById('focusRing');
        let focusTimeout;
        scannerArea.addEventListener('click', async (e) => {
            const rect = scannerArea.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            const y = (e.clientY - rect.top)  / rect.height;

            // Vis fokusring
            focusRing.style.left = (x * 100) + '%';
            focusRing.style.top  = (y * 100) + '%';
            focusRing.classList.add('visible');
            clearTimeout(focusTimeout);
            focusTimeout = setTimeout(() => focusRing.classList.remove('visible'), 1200);

            // Be kameraet fokusere på punktet
            try {
                const video = document.querySelector('#reader video');
                if (!video) return;
                const track = video.srcObject?.getVideoTracks?.()[0];
                if (!track) return;
                const caps = track.getCapabilities?.();
                if (caps?.focusMode?.includes('manual') && caps?.pointOfInterest) {
                    await track.applyConstraints({
                        advanced: [{ focusMode: 'manual', pointOfInterest: { x, y } }]
                    });
                    setTimeout(() => track.applyConstraints({
                        advanced: [{ focusMode: 'continuous' }]
                    }).catch(() => {}), 2000);
                }
            } catch(e) { /* ikke støttet på denne enheten */ }
        });
    }).catch(err => {
        console.error('Kamera-feil:', err);
        updateScannerStatus('Kamera ikke tilgjengelig – bruk manuelt felt. Feil: ' + err.message);
    });
}

function onScanSuccess(decodedText) {
    const now = Date.now();
    if (decodedText === lastScannedCode && (now - lastScanTime) < 3000) return;
    lastScannedCode = decodedText;
    lastScanTime = now;

    if (navigator.vibrate) navigator.vibrate(100);
    touchSession();
    lookupProduct(decodedText);
}

function manualLookup() {
    const ean = document.getElementById('manualEan').value.trim();
    if (!ean) return;
    document.getElementById('manualEan').value = '';
    lookupProduct(ean);
}

document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('manualEan')?.addEventListener('keydown', e => {
        if (e.key === 'Enter') manualLookup();
    });

    // Sjekk om det finnes en aktiv sesjon – hopp over PIN hvis fersk nok
    const session = loadSession();
    if (session && localStorage.getItem(STORAGE_KEY)) {
        config.shopName = session.shopName;
        config.apiKey   = session.apiKey;
        await setProgress(10, 'Gjenoppretter sesjon...');
        await cacheAllVariants(setProgress);
        setProgress(null);
        goToScanner();
    } else {
        renderSetupScreen();
    }

    // Sjekk sesjon når appen kommer tilbake i fokus
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && document.getElementById('scannerScreen').classList.contains('active')) {
            const s = loadSession();
            if (!s) {
                // Sesjon utløpt – krev PIN på nytt
                if (isScanning && html5QrCode) { html5QrCode.stop().catch(() => {}); isScanning = false; }
                document.getElementById('scannerScreen').classList.remove('active');
                document.getElementById('setupScreen').classList.add('active');
                config = { shopName: '', apiKey: '' };
                renderSetupScreen();
                showToast('Sesjonen er utløpt. Skriv inn PIN på nytt.', 'error');
            } else {
                touchSession();
            }
        }

        if (document.visibilityState === 'visible') {
            checkForAppUpdate();
        }
    });

    window.addEventListener('pageshow', () => {
        checkForAppUpdate();
    });

    setInterval(() => {
        if (document.visibilityState === 'visible') {
            checkForAppUpdate();
        }
    }, 60000);

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').then(registration => {
            if (registration.waiting) setUpdateAvailableState(true);

            registration.addEventListener('updatefound', () => {
                const worker = registration.installing;
                if (!worker) return;
                worker.addEventListener('statechange', () => {
                    if (worker.state === 'installed' && navigator.serviceWorker.controller) {
                        setUpdateAvailableState(true);
                    }
                });
            });

            setTimeout(() => registration.update().catch(() => {}), 1500);
        }).catch(() => {});
    }

    checkForAppUpdate();
});

async function lookupProduct(code) {
    updateScannerStatus('Søker: ' + code);

    // Check cache: direct EAN
    const product = productCache[code];
    if (product) {
        addDebugLog('Funnet i cache: ' + JSON.stringify(product));
        showProductCard(product, code);
    } else {
        addDebugLog('Ikke i cache, søker API for varianter...');
        // Fallback: search API by EAN filter on variants
        try {
            const data = await apiFetch(`/product-variants?filter[ean][path]=ean&filter[ean][value]=${encodeURIComponent(code)}&page[size]=1&include=product-attributes`);
            if (data.data && data.data.length > 0) {
                const v = data.data[0];
                const productId = v.relationships?.product?.data?.id;

                // Hent produktnavn
                const pData = await apiFetch(`/products/${productId}?fields[products]=name`);
                const name = decodeHtmlEntities(pData.data?.attributes?.name?.no || pData.data?.attributes?.name?.en || 'Ukjent');

                // Hent variantnavn fra inkluderte product-attributes → option-values
                let variantName = '';
                const includedPAs = (data.included || []).filter(i => i.type === 'product-attributes');
                const ovIds = includedPAs
                    .map(pa => pa.relationships?.['product-option-value']?.data?.id)
                    .filter(Boolean);
                if (ovIds.length > 0) {
                    try {
                        const ovParts = await Promise.all(ovIds.map(async ovId => {
                            const ovData = await apiFetch(`/product-option-values/${ovId}`);
                            const n = ovData.data?.attributes?.name;
                            const raw = (n && typeof n === 'object')
                                ? (n.no || n.en || Object.values(n)[0] || '') : (n || '');
                            return decodeHtmlEntities(raw);
                        }));
                        variantName = ovParts.filter(Boolean).join(' / ');
                    } catch(e) { addDebugLog('Feil ved henting av option-values: ' + e.message); }
                }

                const entry = {
                    productId, variantId: v.id, name, variantName,
                    ean: v.attributes.ean || '',
                    sku: v.attributes.sku || '',
                    quantity: parseInt(v.attributes.quantity) || 0
                };
                if (entry.ean) productCache[entry.ean] = entry;
                productCache['vid:' + v.id] = entry;
                addDebugLog('Funnet i varianter: ' + JSON.stringify(entry));
                showProductCard(entry, code);
            } else {
                addDebugLog('Ikke funnet i varianter, søker alle varianter...');
                // Fallback: søk på alle varianter for EAN
                try {
                    let allVariants = [];
                    let varPage = 1;
                    let varHasMore = true;
                    const startTime = Date.now();
                    while (varHasMore && varPage <= 20) {  // Maks 20 sider, 250*20=5000
                        if (Date.now() - startTime > 10000) {
                            addDebugLog('Variantsøk avbrutt: tok for lang tid (>10 sek)');
                            showToast('Søk på alle varianter tok for lang tid og ble avbrutt.', 'error');
                            updateScannerStatus('Avbrutt – prøv igjen');
                            return;
                        }
                        addDebugLog('Henter variant-side ' + varPage);
                        const data = await apiFetch(`/product-variants?page[size]=250&page[number]=${varPage}`);
                        const variants = data.data || [];
                        allVariants = allVariants.concat(variants);
                        varHasMore = variants.length === 250;
                        varPage++;
                    }
                    addDebugLog('Totalt hentet varianter: ' + allVariants.length);
                    const found = allVariants.find(v => v.attributes.ean === code);
                    if (found) {
                        const productId = found.relationships?.product?.data?.id;
                        let name = 'Ukjent';
                        try {
                            const pData = await apiFetch(`/products/${productId}?fields[products]=name`);
                            name = pData.data?.attributes?.name?.no || pData.data?.attributes?.name?.en || 'Ukjent';
                        } catch (err) {
                            addDebugLog('Kunne ikke hente produktnavn: ' + err.message);
                        }
                        const entry = {
                            productId: productId,
                            variantId: found.id,
                            name: name,
                            variantName: '',
                            ean: found.attributes.ean || '',
                            sku: found.attributes.sku || '',
                            quantity: parseInt(found.attributes.quantity) || 0
                        };
                        if (entry.ean) productCache[entry.ean] = entry;
                        addDebugLog('Funnet i alle varianter: ' + JSON.stringify(entry));
                        showProductCard(entry, code);
                    } else {
                        const eans = allVariants.filter(v => v.attributes.ean).map(v => v.attributes.ean);
                        addDebugLog('Ikke funnet i alle varianter heller. Tilgjengelige EAN (' + eans.length + '): ' + eans.slice(0,10).join(', ') + (eans.length > 10 ? ', ...' : ''));
                        showToast('Produkt ikke funnet: ' + code, 'error');
                        updateScannerStatus('Ikke funnet – prøv igjen');
                    }
                } catch (err) {
                    addDebugLog('Feil ved søk på alle varianter: ' + err.message);
                    showToast('Feil ved oppslag', 'error');
                    updateScannerStatus('Feil – prøv igjen');
                }
            }
        } catch (err) {
            addDebugLog('Feil ved søk på varianter: ' + err.message);
            showToast('Feil ved oppslag', 'error');
            updateScannerStatus('Feil – prøv igjen');
        }
    }
}

function stepQty(delta) {
    const inp = document.getElementById('qtyInput');
    if (!inp) return;
    let val = parseInt(inp.value) || 0;
    val = Math.max(0, val + delta);
    inp.value = val;
}

function stepRestockQty(delta) {
    const inp = document.getElementById('qtyInput');
    const totalEl = document.getElementById('restockTotal');
    if (!inp || !totalEl) return;
    const oldQty = parseInt(totalEl.dataset.old || totalEl.textContent) || 0;
    let addQty = parseInt(inp.value) || 0;
    addQty = Math.max(-oldQty, addQty + delta);
    inp.value = addQty;
    updateRestockCalc(oldQty);
}

function updateRestockCalc(oldQty) {
    const inp     = document.getElementById('qtyInput');
    const addEl   = document.getElementById('restockAdd');
    const totalEl = document.getElementById('restockTotal');
    if (!inp || !addEl || !totalEl) return;
    const addQty = Math.max(-oldQty, parseInt(inp.value) || 0);
    inp.value = addQty;
    addEl.textContent   = `${addQty > 0 ? '+' : ''}${addQty}`;
    totalEl.textContent = oldQty + addQty;
    totalEl.dataset.old = oldQty;
}

function registerRestock(variantId, productId, name, ean, oldQty, variantName) {
    name = decodeURIComponent(name);
    ean  = decodeURIComponent(ean);
    variantName = decodeURIComponent(variantName || '');
    const inp    = document.getElementById('qtyInput');
    const addQty = parseInt(inp?.value);
    if (isNaN(addQty) || addQty === 0) {
        showToast('Legg inn et positivt eller negativt antall', 'error');
        return;
    }
    if (oldQty + addQty < 0) {
        showToast('Kan ikke redusere under 0 på lager', 'error');
        return;
    }

    const itemId   = variantId || productId;
    const existing = restockItems.find(i => (i.variantId || i.productId) === itemId);
    if (existing) {
        existing.addQty = addQty;
        existing.status = 'pending';
        if (variantName) existing.variantName = variantName;
    } else {
        restockItems.push({ variantId, productId, name, variantName: variantName || '', ean, oldQty, addQty, status: 'pending' });
    }

    document.getElementById('currentProduct').innerHTML = '';
    restoreScannerArea();
    updateRestockList();
    saveRestockItems();
    touchSession();
    showToast(`${name}: ${addQty > 0 ? '+' : ''}${addQty} stk registrert`, 'success');
    updateScannerStatus('Skann neste vare...');
}

function updateRestockList() {
    const el = document.getElementById('restockSection');
    if (!el) return;
    if (restockItems.length === 0) { el.innerHTML = ''; return; }

    let html = `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
            <div class="section-title" style="margin-bottom:0;">Varepåfyll (${restockItems.length})</div>
            <button onclick="deleteAllRestock()" style="font-size:12px; padding:5px 14px; border-radius:6px; background:transparent; color:var(--danger); border:1px solid var(--danger); font-weight:500; cursor:pointer;">Slett alle</button>
        </div>`;

    for (let i = restockItems.length - 1; i >= 0; i--) {
        const item = restockItems[i];
        const newQty = item.oldQty + item.addQty;
        const addQtyLabel = `${item.addQty > 0 ? '+' : ''}${item.addQty}`;
        const addQtyColor = item.addQty >= 0 ? 'var(--restock)' : 'var(--danger)';
        const statusClass = item.status === 'saved' ? 'status-saved' : item.status === 'error' ? 'status-error' : 'status-pending';
        const statusText  = item.status === 'saved' ? 'Lagret' : item.status === 'error' ? 'Feil' : 'Venter';
        html += `
            <div class="counted-item">
                <div class="item-top">
                    <div class="item-info">
                        <div class="item-name">${escHtml(item.name || '')}</div>
                        ${item.variantName ? `<div class="item-variant">${escHtml(item.variantName)}</div>` : ''}
                        <div class="item-ean">${item.ean ? 'EAN: ' + escHtml(item.ean) : ''}</div>
                    </div>
                    <span class="item-qty" style="color:${addQtyColor};">${addQtyLabel}</span>
                </div>
                <div class="item-bottom">
                    <span class="item-qty-change">${item.oldQty} ${item.addQty >= 0 ? '+' : '−'} ${Math.abs(item.addQty)} = <strong>${newQty}</strong></span>
                    <span class="item-status ${statusClass}">${statusText}</span>
                    <button class="item-edit-btn" onclick="editRestockItem('${item.variantId || ''}', '${item.productId}')">Endre</button>
                    <button class="item-delete-btn" onclick="deleteRestockItem('${item.variantId || ''}', '${item.productId}')">Slett</button>
                </div>
            </div>`;
    }
    el.innerHTML = html;
}

function deleteAllRestock() {
    if (restockItems.length === 0) return;
    showConfirm('Slett alle påfyll?', `${restockItems.length} oppføringer vil bli fjernet.`, () => {
        restockItems = [];
        saveRestockItems();
        updateRestockList();
    });
}

function deleteRestockItem(variantId, productId) {
    const idx = restockItems.findIndex(i =>
        (i.variantId === variantId || (!i.variantId && variantId === '')) && i.productId === productId);
    if (idx === -1) return;
    const item  = restockItems[idx];
    const label = [item.name, item.variantName].filter(Boolean).join(' – ');
    showConfirm(`Slett «${label}»?`, 'Varen fjernes fra påfylllisten.', () => {
        restockItems.splice(idx, 1);
        saveRestockItems();
        updateRestockList();
    });
}

function editRestockItem(variantId, productId) {
    const item = restockItems.find(i =>
        (i.variantId === variantId || (!i.variantId && variantId === '')) && i.productId === productId);
    if (!item) return;

    const product = {
        name: item.name,
        variantName: item.variantName || '',
        ean: item.ean,
        variantId: item.variantId,
        productId: item.productId,
        quantity: item.oldQty !== undefined ? item.oldQty : 0,
    };

    if (appMode !== 'restock') {
        switchMode('restock');
    }
    showProductCard(product, item.ean || '');

    setTimeout(() => {
        const input = document.getElementById('qtyInput');
        if (input) {
            const oldQty = item.oldQty !== undefined ? item.oldQty : 0;
            input.value = item.addQty || 0;
            updateRestockCalc(oldQty);
        }
    }, 50);
}

function registerCount(variantId, productId, name, ean, oldQty, variantName) {
    name = decodeURIComponent(name);
    ean = decodeURIComponent(ean);
    variantName = decodeURIComponent(variantName || '');
    const inp = document.getElementById('qtyInput');
    const newQty = parseInt(inp?.value);
    if (isNaN(newQty) || newQty < 0) {
        showToast('Ugyldig antall', 'error');
        return;
    }

    const itemId = variantId || productId;
    const existing = countedItems.find(i => (i.variantId || i.productId) === itemId);
    if (existing) {
        existing.newQty = newQty;
        existing.status = 'pending';
        if (variantName) existing.variantName = variantName;
    } else {
        countedItems.push({ variantId, productId, name, variantName: variantName || '', ean, sku: '', oldQty, newQty, status: 'pending' });
    }

    document.getElementById('currentProduct').innerHTML = '';
    restoreScannerArea();
    updateCountedList();
    updateBadge();
    saveCountedItems();
    touchSession();
    showToast(`${name}: ${newQty} stk registrert`, 'success');
    updateScannerStatus('Skann neste vare...');
}

// ─── COUNTED LIST ────────────────────────────────────
function updateCountedList() {
    if (countedItems.length === 0) {
        document.getElementById('countedSection').innerHTML = '';
        return;
    }

    let html = `
        <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:4px;">
            <div class="section-title" style="margin-bottom:0;">Telte varer (${countedItems.length})</div>
            <button onclick="deleteAllCounted()" style="font-size:12px; padding:5px 14px; border-radius:6px; background:transparent; color:var(--danger); border:1px solid var(--danger); font-weight:500; cursor:pointer;">Slett alle</button>
        </div>
    `;
    for (let i = countedItems.length - 1; i >= 0; i--) {
        const item = countedItems[i];
        const diff = item.newQty - item.oldQty;
        const diffStr = diff > 0 ? `+${diff}` : String(diff);
        const statusClass = item.status === 'saved' ? 'status-saved' : item.status === 'error' ? 'status-error' : 'status-pending';
        const statusText = item.status === 'saved' ? 'Lagret' : item.status === 'error' ? 'Feil' : 'Venter';

        const productName = item.name || '';
        const variantName = item.variantName || '';

        html += `
            <div class="counted-item">
                <div class="item-top">
                    <div class="item-info">
                        <div class="item-name">${escHtml(productName)}</div>
                        ${variantName ? `<div class="item-variant">${escHtml(variantName)}</div>` : ''}
                        <div class="item-ean">${item.ean ? 'EAN: ' + escHtml(item.ean) : ''}</div>
                    </div>
                    <span class="item-qty">${item.newQty}</span>
                </div>
                <div class="item-bottom">
                    <span class="item-qty-change">${item.oldQty} → ${item.newQty} <span style="color:${diff >= 0 ? 'var(--success)' : 'var(--danger)'};font-weight:600;">(${diffStr})</span></span>
                    <span class="item-status ${statusClass}">${statusText}</span>
                    <button class="item-edit-btn" onclick="editCountedItem('${item.variantId || ''}', '${item.productId}')">Endre</button>
                    <button class="item-delete-btn" onclick="deleteCountedItem('${item.variantId || ''}', '${item.productId}')">Slett</button>
                </div>
            </div>
        `;
    }
    document.getElementById('countedSection').innerHTML = html;
}

async function refreshProductCache() {
    closeMoreMenu();
    showToast('Oppdaterer produktliste fra MyStore...', 'success');
    productCache = {};
    localStorage.removeItem(PRODUCT_CACHE_KEY);
    await cacheAllVariants(null, true);
}

// Slett alle telte varer
function deleteAllCounted() {
    if (countedItems.length === 0) return;
    showConfirm(
        'Slett alle telte varer?',
        `${countedItems.length} vare${countedItems.length === 1 ? '' : 'r'} vil bli fjernet fra tellelisten.`,

    );

function showConfirm(title, message, onConfirm) {
    let modal = document.getElementById('confirmModal');
    if (!modal) {
        modal = document.createElement('div');
        modal.id = 'confirmModal';
        modal.style.cssText = `
            position: fixed; inset: 0; z-index: 10000;
            background: rgba(0,0,0,0.75);
            display: flex; align-items: center; justify-content: center;
            padding: 16px; box-sizing: border-box;
        `;
        modal.innerHTML = `
            <div style="
                background: var(--surface-1, #1e1e2e); color: var(--text, #cdd6f4);
                border-radius: 14px; width: 100%; max-width: 360px;
                padding: 24px; box-shadow: 0 8px 40px rgba(0,0,0,0.6);
            ">
                <div id="confirmTitle" style="font-size:17px; font-weight:700; margin-bottom:8px;"></div>
                <div id="confirmMessage" style="font-size:14px; color: var(--text-muted, #aaa); margin-bottom:24px;"></div>
                <div style="display:flex; gap:10px; justify-content:flex-end;">
                    <button id="confirmCancel" style="
                        padding: 10px 20px; border-radius: 8px; font-size:14px; font-weight:600;
                        background: var(--surface-2, #313244); color: var(--text, #cdd6f4);
                        border: none; cursor: pointer;">Avbryt</button>
                    <button id="confirmOk" style="
                        padding: 10px 20px; border-radius: 8px; font-size:14px; font-weight:600;
                        background: var(--danger, #e17055); color: #fff;
                        border: none; cursor: pointer;">Slett</button>
                </div>
            </div>
        `;
        document.body.appendChild(modal);
    }
    document.getElementById('confirmTitle').textContent = title;
    document.getElementById('confirmMessage').textContent = message;
    modal.style.display = 'flex';

    const hide = () => { modal.style.display = 'none'; };
    document.getElementById('confirmCancel').onclick = hide;
    document.getElementById('confirmOk').onclick = () => { hide(); onConfirm(); };
    modal.onclick = e => { if (e.target === modal) hide(); };
}

// Gjør det mulig å endre antall på nytt fra telt-listen
function editCountedItem(variantId, productId) {
    // Finn riktig item fra countedItems
    const item = countedItems.find(i => (i.variantId === variantId || (!i.variantId && variantId === '')) && i.productId === productId);
    if (!item) return;
    // Vis produktkortet med forrige antall forhåndsutfylt
    let product = {
        name: item.name,
        variantName: item.variantName || '',
        ean: item.ean,
        variantId: item.variantId,
        productId: item.productId,
        quantity: item.oldQty !== undefined ? item.oldQty : '',
    };
    showProductCard(product, item.ean || '');

    setTimeout(() => {
        const input = document.getElementById('qtyInput');

}

function updateBadge() {
    const badge = document.getElementById('countBadge'); if (badge) badge.textContent = countedItems.length + ' telt';
}


// ─── SAVE TO MYSTORE ─────────────────────────────────
function saveAll() {
    if (appMode === 'restock') saveAllRestockToMyStore();
    else saveAllToMyStore();
}

async function saveAllRestockToMyStore() {
    const pending = restockItems.filter(i => i.status !== 'saved');
    if (pending.length === 0) { showToast('Ingen ventende påfyll å lagre', 'error'); return; }

    const saveBtn = document.getElementById('saveBtn');
    const wrap    = document.getElementById('saveProgressWrap');
    const bar     = document.getElementById('saveProgressBar');
    const lbl     = document.getElementById('saveProgressLabel');

    saveBtn.disabled = true;
    wrap.style.display = 'block';
    bar.style.width = '0%';

    let done = 0;
    let savedCount = 0;
    for (const item of pending) {
        const name    = [item.name, item.variantName].filter(Boolean).join(' – ');
        const newQty  = item.oldQty + item.addQty;
        lbl.textContent = `Lagrer ${done + 1} av ${pending.length}: ${name}`;
        bar.style.width = Math.round((done / pending.length) * 100) + '%';
        await new Promise(r => setTimeout(r, 60));
        try {
            if (!item.variantId) {
                await updateProductStock(item.productId, newQty);
            } else {
                await updateVariantStock(item.variantId, newQty);
            }
            item.status = 'saved';
            item.oldQty = newQty; // oppdater slik at dobbel-lagring ikke dobler igjen
            savedCount++;
            const cacheKey = item.variantId ? 'vid:' + item.variantId : item.ean;
            if (cacheKey && productCache[cacheKey]) productCache[cacheKey].quantity = newQty;
            if (item.ean && productCache[item.ean]) productCache[item.ean].quantity = newQty;
        } catch(e) {
            item.status = 'error';
            showToast(`Feil ved lagring: ${e.message}`, 'error');
        }
        done++;
    }

    bar.style.width = '100%';
    lbl.textContent = `Ferdig! ${savedCount} påfyll lagret.`;
    restockItems = restockItems.filter(item => item.status !== 'saved');
    saveRestockItems();
    await new Promise(r => setTimeout(r, 1200));
    wrap.style.display = 'none';
    saveBtn.disabled = false;
    updateRestockList();
}

async function saveAllToMyStore() {
    const pending = countedItems.filter(i => i.status !== 'saved');
    if (pending.length === 0) {
        showToast('Ingen ventende varer å lagre', 'error');
        return;
    }

    const saveBtn = document.getElementById('saveBtn');
    const wrap    = document.getElementById('saveProgressWrap');
    const bar     = document.getElementById('saveProgressBar');
    const lbl     = document.getElementById('saveProgressLabel');

    saveBtn.disabled = true;
    wrap.style.display = 'block';
    bar.style.width = '0%';

    let done = 0;
    for (const item of pending) {
        const name = [item.name, item.variantName].filter(Boolean).join(' – ');
        lbl.textContent = `Lagrer ${done + 1} av ${pending.length}: ${name}`;
        bar.style.width = Math.round((done / pending.length) * 100) + '%';
        await new Promise(r => setTimeout(r, 60));

        try {
            if (!item.variantId) {
                await updateProductStock(item.productId, item.newQty);
                item.status = 'saved';
            } else {
                await updateVariantStock(item.variantId, item.newQty);
                item.status = 'saved';
            }
            const cacheKey = item.variantId ? 'vid:' + item.variantId : item.ean;
            if (cacheKey && productCache[cacheKey]) productCache[cacheKey].quantity = item.newQty;
            if (item.ean && productCache[item.ean]) productCache[item.ean].quantity = item.newQty;
        } catch (e) {
            item.status = 'error';
            console.error('Lagring feilet for vare:', item, e);
            showToast(`Feil ved lagring: ${e.message}`, 'error');
        }
        done++;
    }

    bar.style.width = '100%';
    lbl.textContent = `Ferdig! ${done} vare${done === 1 ? '' : 'r'} lagret.`;
    saveCountedItems();
    await new Promise(r => setTimeout(r, 1200));
    wrap.style.display = 'none';
    saveBtn.disabled = false;

    updateCountedList();
}

// ─── EXPORT CSV ──────────────────────────────────────
function exportCSV() {
    if (countedItems.length === 0) {
        showToast('Ingen varer å eksportere', 'error');
        return;
    }
    const header = 'VariantID;ProduktID;Navn;EAN;Gammelt antall;Nytt antall;Differanse;Status\n';
    const rows = countedItems.map(i => {
        const diff = i.newQty - i.oldQty;
        return `${i.variantId};${i.productId};"${i.name}";${i.ean};${i.oldQty};${i.newQty};${diff};${i.status}`;
    }).join('\n');

    const blob = new Blob(['\uFEFF' + header + rows], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `varetelling_${new Date().toISOString().slice(0, 10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
    showToast('CSV eksportert', 'success');
}

    const div = document.createElement('div');

    return div.innerHTML;
}
function decodeHtmlEntities(str) {
    if (!str) return '';
    const txt = document.createElement('textarea');
    txt.innerHTML = str;
    return txt.value;
}

function updateScannerStatus(text) {
    const el = document.getElementById('scannerStatus');
    if (el) {
        if (text.includes('Laster')) {
            el.innerHTML = '<span class="spinner"></span> ' + text;
        } else {
            el.textContent = text;
        }
    }
}

function showToast(msg, type = '') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show' + (type ? ' ' + type : '');
    clearTimeout(el._timer);
    el._timer = setTimeout(() => el.className = 'toast', 2500);
}

async function hardReloadApp() {
    try {
        if ('serviceWorker' in navigator) {
            const regs = await navigator.serviceWorker.getRegistrations();
            await Promise.all(regs.map(r => r.unregister().catch(() => {})));
        }
        if (window.caches && caches.keys) {
            const keys = await caches.keys();
            await Promise.all(keys.map(k => caches.delete(k).catch(() => {})));
        }
    } catch (e) {
        console.warn('Hard reload cleanup feilet:', e);
    } finally {
        window.location.reload();
    }
}
